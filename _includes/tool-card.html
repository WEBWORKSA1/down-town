{% assign tl = site.data.tools | where: "slug", include.tool | first %}{% if tl %}<div class="tool-card line-{{ tl.line }}"><span class="bullet {{ tl.line }}" aria-hidden="true">{{ tl.line | upcase }}</span><div><b>{{ tl.name }}</b><span>{{ tl.desc }}</span></div><a class="btn sm ghost" href="/tools/{{ tl.slug }}.html{% if page.city %}?city={{ page.city }}{% endif %}">Open the {{ tl.short | default: "tool" }}</a></div>{% endif %}
