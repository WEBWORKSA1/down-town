{% if page.home %}<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"{{ site.url }}/#org","name":"Down.Town","url":"{{ site.url }}/","logo":"{{ site.url }}/assets/img/favicon.svg","description":{{ site.description | jsonify }}},{"@type":"WebSite","@id":"{{ site.url }}/#site","url":"{{ site.url }}/","name":"Down.Town","publisher":{"@id":"{{ site.url }}/#org"},"potentialAction":{"@type":"SearchAction","target":"{{ site.url }}/?q={search_term_string}","query-input":"required name=search_term_string"}}]}</script>{% endif %}
{% if page.layout == "article" or page.layout == "city" or page.layout == "space" %}{% assign sc = site.data.cities | where: "slug", page.city | first %}<script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"dateModified":"{{ page.updated }}","datePublished":"{{ page.published | default: page.updated }}","mainEntityOfPage":"{{ site.url }}{{ page.url }}","image":"{{ site.url }}/assets/img/og.svg","author":{"@type":"Organization","name":"Down.Town editors","url":"{{ site.url }}/about.html"},"publisher":{"@type":"Organization","name":"Down.Town","logo":{"@type":"ImageObject","url":"{{ site.url }}/assets/img/favicon.svg"}}{% if sc %},"about":{"@type":"Place","name":{{ sc.district | append: ", " | append: sc.name | jsonify }},"geo":{"@type":"GeoCoordinates","latitude":{{ sc.lat }},"longitude":{{ sc.lng }}}}{% endif %}}</script>{% endif %}
