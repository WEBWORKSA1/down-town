<section class="sec tight alt" aria-labelledby="nl-h">
  <div class="wrap news-band">
    <div>
      <span class="tag"><span class="bullet d" aria-hidden="true">D</span> Free, every Friday</span>
      <h2 id="nl-h" style="margin-top:.5rem">The Downtown Dispatch</h2>
      <p class="muted">A city centre worth your weekend, a tool or guide for movers and business owners, open contest calls and new space on the market. Pick the editions you want; leave with one click.</p>
    </div>
    <form class="form" data-form="Newsletter signup" data-ok="You're on the list. Your first Dispatch lands Friday.">
      <div class="news-form">
        <label class="vh" for="nl-email">Email address</label>
        <input id="nl-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <button class="btn" type="submit">Subscribe</button>
      </div>
      <fieldset class="field"><legend class="vh">Editions</legend><div class="opts small-opts">
        <label class="opt"><input type="checkbox" name="lists" value="City weekend" checked><span>City weekend</span></label>
        <label class="opt"><input type="checkbox" name="lists" value="Moving downtown"><span>Moving downtown</span></label>
        <label class="opt"><input type="checkbox" name="lists" value="Space &amp; business"><span>Space &amp; business</span></label>
        <label class="opt"><input type="checkbox" name="lists" value="Contests"><span>Contests</span></label>
      </div></fieldset>
      <label class="check"><input type="checkbox" name="consent" value="Yes, newsletter" required> <span>Yes, send me the Downtown Dispatch. I can unsubscribe anytime. See the <a href="/privacy.html">privacy policy</a>.</span></label>
      <div class="hp" aria-hidden="true"><input type="text" name="_hp" tabindex="-1" autocomplete="off"></div>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
