{% if page.faq %}<section class="faq-block" aria-labelledby="faq-h">
<h2 id="faq-h">Questions people ask</h2>
<div class="faq">{% for f in page.faq %}<details{% if forloop.first %} open{% endif %}><summary>{{ f.q }}</summary><p>{{ f.a }}</p></details>{% endfor %}</div>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for f in page.faq %}{"@type":"Question","name":{{ f.q | strip_html | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ f.a | strip_html | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
</section>{% endif %}
